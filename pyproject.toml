[project]
name = "load-most-recent-image"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
# Pin the target instead of inheriting `requires-python`: ComfyUI runs on
# whatever Python the user has, and `ruff format` targets PEP 758
# (`except A, B:` without parentheses) on 3.14+, which is a SyntaxError
# earlier and would stop the node from importing at all.
target-version = "py312"
lint.ignore = ["N999"]


[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
