[project]
name = "load-most-recent-image"
version = "0.2.0"
description = "ComfyUI node that loads the newest image from a folder, with an optional fallback tensor and a persistent per-configuration history of resolved outputs"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.13",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
# Pin the target instead of inheriting `requires-python`: ComfyUI runs on
# whatever Python the user has, and `ruff format` targets PEP 758
# (`except A, B:` without parentheses) on 3.14+, which is a SyntaxError
# earlier and would stop the node from importing at all.
target-version = "py312"
lint.ignore = ["N999"]

# Measure the plugin's own source only. `nodes.py` and the package root are
# loaded under the `LoadMostRecentImage.*` name, so scoping to `utils` alone
# would leave the node logic unreported.
[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", "*/site-packages/*", "tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
pythonpath = [".", "tests/stubs"]
addopts = "--import-mode=importlib --cov --cov-report=term-missing --cov-fail-under=100"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
