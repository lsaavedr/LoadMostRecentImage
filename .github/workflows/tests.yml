name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ComfyUI runs on the user's Python, not ours. Keep the plugin working
        # on the versions ComfyUI actually ships with, not just the dev one.
        python-version: ["3.12", "3.14"]

    # Job-level so no step can forget it: without UV_PYTHON, uv falls back to
    # the newest interpreter it finds and the leg silently tests the wrong one
    # while still being labelled 3.12.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest
