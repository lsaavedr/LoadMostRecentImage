name: Lint, format and tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  python:
    # Named after the interpreter rather than left as `test (3.12)`, so the
    # matrix legs are readable in the run list without opening the run.
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        # ComfyUI runs on the user's Python, not ours. Keep the plugin working
        # on the versions ComfyUI actually ships with, not just the dev one.
        python-version: ["3.12", "3.14"]

    # Job-level so no step can forget it: without UV_PYTHON, uv falls back to
    # the newest interpreter it finds and the leg silently tests the wrong one
    # while still being labelled 3.12.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  web:
    name: Web extension
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run web tests
        run: npm test
